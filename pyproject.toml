[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledger-forensics"
version = "0.1.0"
description = "Deterministic forensic checks on a payments CSV: Benford, duplicates, split invoices, threshold hugging, round amounts, weekend postings."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Oğuzhan Balım" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ledger-forensics = "ledger_forensics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_forensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
